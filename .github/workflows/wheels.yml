name: Wheels

on:
  workflow_dispatch:

jobs:
  build_sdist:
    name: Build SDist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true

    - name: Build SDist
      run: pipx run build --sdist

    - name: Check metadata
      run: pipx run twine check dist/*

    - uses: actions/upload-artifact@v5
      with:
        name: dist-sdist
        path: dist/*.tar.gz


  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true

    - name: Build Wheels
      uses: pypa/cibuildwheel@v4.3.1
      with:
          package-dir: .
          output-dir: wheelhouse
          config-file: "{package}/pyproject.toml" 
      env:
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_MACOS: x86_64
          CIBW_BEFORE_ALL_LINUX: "yum install -y nasm || dnf install -y nasm || apt-get update && apt-get install -y nasm || apk add nasm"
          CIBW_BEFORE_ALL_MACOS: "brew install nasm"

    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        path: wheelhouse/*.whl
        name: dist-${{ matrix.os }}-${{ strategy.job-index }}
