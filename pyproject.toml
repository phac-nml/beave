
[build-system]
requires = ["scikit-build-core >=0.4.3", "nanobind >=1.3.2"]
build-backend = "scikit_build_core.build"

[project]
name = "dist-mat"
version = "0.0.1"
description = "A brief proof of concept for fast clustering"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Matthew Wells", email = "matthew.wells@phac-aspc.gc.ca" }]
classifiers = ["License :: Apache-2.0"]
dependencies = ["numpy >= 2.4.0", "polars >=1.38.0", "scipy >= 1.17.0"]

[tool.scikit-build]
minimum-version = "0.8"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312" # build wheels for stable API Cpython 3.12+
cmake.args = ["-DTARGET_GROUP=python"]
cmake.version = ">=3.26.1"
messages.after-success = "{green}Wheel successfully built"
messages.after-failure = """
{bold.red}Sorry{normal}, build failed. Your platform is {platform.platform}.
"""
logging.level = "DEBUG"
