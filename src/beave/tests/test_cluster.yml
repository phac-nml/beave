- name: Run cluster cophenetic fail threshold
  tags:
    - should_fail
  command: beave cluster --input src/beave/tests/data/R1KC1K.tsv -l average -nm -b cophenetic -n 2 --thresholds 0.1.0
  exit_code: 2
  files:
    - path: "tree.nwk"
      should_exist: false
    - path: clusters.tsv
      should_exist: false
  stderr:
    contains:
      - "beave cluster: error: argument --thresholds/-t: invalid cluster_threshold value: '0.1.0'"

- name: Run cluster cophenetic fail threshold due to positive and negative values
  tags:
    - should_fail
  command: beave cluster --input src/beave/tests/data/R1KC1K.tsv -l average -nm -b cophenetic -n 2 --thresholds 101 -1
  exit_code: 2
  stderr:
    contains:
      - "Sorry, threshold values must be positive and not infinity. You passed: -1"

