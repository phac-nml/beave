- name: Run fast-matching
  tags: 
    - should_pass
  command: beave match -c 1 -q src/beave/tests/data/R1KC1K.tail.tsv -r src/beave/tests/data/R1KC1K.head.tsv -m
  files:
    - path: "results.tsv"

- name: Run fast-matching output directory created
  tags: 
    - should_pass
  command: beave match -c 1 -q src/beave/tests/data/R1KC1K.tail.tsv -r src/beave/tests/data/R1KC1K.head.tsv -o out -m
  files:
    - path: "out/results.tsv"
      should_exist: true

- name: Run fast-matching normalized
  tags: 
    - should_pass
  command: beave match -c 2 -r src/beave/tests/data/R1KC1K.sorted.tail.tsv -q src/beave/tests/data/R1KC1K.sorted.head.tsv -nm 
  files:
    - path: "results.tsv"

- name: Run fast-matching normalized with excessive distance cut-off
  tags:
    - should_fail
  command: beave match -c 2 -r src/beave/tests/data/R1KC1K.tail.tsv -q src/beave/tests/data/R1KC1K.head.tsv -nm -t 101
  exit_code: 1
  files:
    - path: "results.tsv"
      should_exist: false
  stderr:
    contains:
      - "Sorry, normalized distance specified, but values greater than or equal to 100.0 are provided. 101.0"

- name: Run fast-matching subset columns
  tags:
    - should_fail
  command: beave match -c 0 -r src/beave/tests/data/R1KC1K.tail.tsv -q src/beave/tests/data/R1KC1K.head.tsv -m -t 11 -s src/beave/tests/data/header-keep.txt
  files:
    - path: "results.tsv"
      should_exist: True

- name: Run fast-matching columns do not match
  tags:
    - should_fail
  command: beave match -c 2 -r src/beave/tests/data/R1KC1K.tail.tsv -q src/beave/tests/data/simple_test_profiles.tsv -m -t 101
  exit_code: 1
  files:
    - path: "results.tsv"
      should_exist: false
  stderr:
    contains:
      - "Sorry, the loci in your reference set do not match those in your query. Too many differences to list: 1003"
