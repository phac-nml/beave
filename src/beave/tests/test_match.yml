- name: Run fast-matching
  tags: 
    - should_pass
  command: beave match -n 1 -q src/beave/tests/data/R1KC1K.tail.tsv -r src/beave/tests/data/R1KC1K.head.tsv -o output.tsv -c
  files:
    - path: "output.tsv"

- name: Run fast-matching output directory created
  tags: 
    - should_pass
  command: beave match -n 1 -q src/beave/tests/data/R1KC1K.tail.tsv -r src/beave/tests/data/R1KC1K.head.tsv -o out/output.tsv -c
  files:
    - path: "out/output.tsv"
      should_exist: true

- name: Run fast-matching normalized
  tags: 
    - should_pass
  command: beave match -n 2 -r src/beave/tests/data/R1KC1K.sorted.tail.tsv -q src/beave/tests/data/R1KC1K.sorted.head.tsv -o output.tsv -cs
  files:
    - path: "output.tsv"

- name: Run fast-matching normalized with excessive distance cut-off
  tags:
    - should_fail
  command: beave match -n 2 -r src/beave/tests/data/R1KC1K.tail.tsv -q src/beave/tests/data/R1KC1K.head.tsv -o output.tsv -cs -t 101
  exit_code: 1
  files:
    - path: "output.tsv"
      should_exist: false
  stderr:
    contains:
      - "Sorry, normalized distance specified, but values greater than 100.0 are provided."

- name: Run fast-matching subset columns
  tags:
    - should_fail
  command: beave match -n 0 -r src/beave/tests/data/R1KC1K.tail.tsv -q src/beave/tests/data/R1KC1K.head.tsv -o output.tsv -c -t 11 -k src/beave/tests/data/header-keep.txt
  files:
    - path: "output.tsv"
      should_exist: True

- name: Run fast-matching columns do not match
  tags:
    - should_fail
  command: beave match -n 2 -r src/beave/tests/data/R1KC1K.tail.tsv -q src/beave/tests/data/simple_test_profiles.tsv -o output.tsv -c -t 101
  exit_code: 1
  files:
    - path: "output.tsv"
      should_exist: false
  stderr:
    contains:
      - "Sorry, the loci in your reference set do not match those in your query. Too many differences to list: 1003"
