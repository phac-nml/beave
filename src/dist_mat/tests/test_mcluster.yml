- name: Run mcluster pass
  command: dist-mat mcluster --input tests/R1KC1K.tsv -t tree.out -m average -l clusters.tsv -sc -b patristic -n 2 --thresholds 10.0 9.0 8.0
  files:
    - path: "tree.out"
      should_exist: true
    - path: clusters.tsv
      should_exist: true

- name: Run mcluster pass cophenetic
  tags:
    - should_pass
  command: dist-mat mcluster --input tests/R1KC1K.tsv -t tree.out -m average -l clusters.tsv -sc -b cophenetic -n 2 --thresholds 10.0 9.0 8.0
  files:
    - path: "tree.out"
      should_exist: true
    - path: clusters.tsv
      should_exist: true

- name: Run mcluster pass cophenetic no scaled metric
  tags:
    - should_pass
  command: dist-mat mcluster --input tests/R1KC1K.tsv -t tree.out -m average -l clusters.tsv -c -b cophenetic -n 1 --thresholds 10.0 9.0 8.0
  files:
    - path: "tree.out"
      should_exist: true
    - path: clusters.tsv
      should_exist: true

- name: Run mcluster pass cophenetic no scaled or missing counted metric
  tags:
    - should_pass
  command: dist-mat mcluster --input tests/R1KC1K.tsv -t tree.out -m average -l clusters.tsv -b cophenetic -n 3 --thresholds 10.0 9.0 8.0
  files:
    - path: "tree.out"
      should_exist: true
    - path: clusters.tsv
      should_exist: true

- name: Run mcluster pass cophenetic no scaled or missing counted metric, passing 0 cores program should default to 1
  tags:
    - should_pass
  command: dist-mat mcluster --input tests/R1KC1K.tsv -t tree.out -m average -l clusters.tsv -b cophenetic -n 0 --thresholds 10.0 9.0 8.0
  files:
    - path: "tree.out"
      should_exist: true
    - path: clusters.tsv
      should_exist: true

- name: Run mcluster cophenetic fail thresholds
  tags:
    - should_fail
  command: dist-mat mcluster --input tests/R1KC1K.tsv -t tree.out -m average -l clusters.tsv -sc -b cophenetic -n 2 --thresholds 0.1.0
  exit_code: 2
  files:
    - path: "tree.out"
      should_exist: false
    - path: clusters.tsv
      should_exist: false
  stderr:
    contains:
      - "dist-mat mcluster: error: argument --thresholds/-p: invalid cluster_threshold value: '0.1.0'"

- name: Run mcluster fail thresholds missing argument
  tags:
    - should_fail
  command: dist-mat mcluster --input tests/R1KC1K.tsv -t tree.out -m average -l clusters.tsv -sc -b cophenetic -n 2 --thresholds
  exit_code: 2
  files:
    - path: "tree.out"
      should_exist: false
    - path: clusters.tsv
      should_exist: false
  stderr:
    contains:
      - "dist-mat mcluster: error: argument --thresholds/-p: expected at least one argument"

- name: Run mcluster csv
  tags:
    - should_pass
  command: dist-mat mcluster --input tests/R1KC1K.2-zeroes.csv -t tree.out -m average -l clusters.tsv -sc -b cophenetic -n 2 -p 1 0.5 -d ,
  files:
    - path: "tree.out"
      should_exist: true
    - path: clusters.tsv
      should_exist: true

- name: Run mcluster threshold should fail due to negative number being passed
  tags:
    - should_fail
  command: dist-mat mcluster --input tests/R1KC1K.2-zeroes.csv -t tree.out -m average -l clusters.tsv -sc -b cophenetic -n 2 -p 1 0.5 -d , -f -1
  exit_code: 2
  files:
    - path: "tree.out"
      should_exist: false
    - path: clusters.tsv
      should_exist: false
  stderr:
    contains:
      - "dist-mat mcluster: error: argument --filter-threshold/-f: invalid percentage_range value: '-1'"

- name: Run mcluster, cluster threshold should fail due to negative number being passed.
  tags:
    - should_fail
  command: dist-mat mcluster --input tests/R1KC1K.2-zeroes.csv -t tree.out -m average -l clusters.tsv -sc -b cophenetic -n 2 -p 1 0.5 -1 -d , 
  exit_code: 2
  files:
    - path: "tree.out"
      should_exist: false
    - path: clusters.tsv
      should_exist: false
  stderr:
    contains:
      - "dist-mat mcluster: error: argument --thresholds/-p: invalid cluster_threshold value: '-1'"

- name: Run mcluster, cluster threshold should fail due to infinity being passed.
  tags:
    - should_fail
  command: dist-mat mcluster --input tests/R1KC1K.2-zeroes.csv -t tree.out -m average -l clusters.tsv -sc -b cophenetic -n 2 -p 1 0.5 inf -d , 
  exit_code: 2
  files:
    - path: "tree.out"
      should_exist: false
    - path: clusters.tsv
      should_exist: false
  stderr:
    contains:
      - "dist-mat mcluster: error: argument --thresholds/-p: invalid cluster_threshold value: 'inf'"

- name: Run mcluster threshold should fail due to high threshold
  tags:
    - should_fail
  exit_code: 2
  command: dist-mat mcluster --input tests/R1KC1K.2-zeroes.csv -t tree.out -m average -l clusters.tsv -sc -b cophenetic -n 2 -p 1 0.5 -d , -f 101
  files:
    - path: "tree.out"
      should_exist: false
    - path: clusters.tsv
      should_exist: false
  stderr:
    contains:
      - "dist-mat mcluster: error: argument --filter-threshold/-f: invalid percentage_range value: '101'"

- name: Run mcluster threshold should pass
  tags:
    - should_pass
  command: dist-mat mcluster --input tests/R1KC1K.2-zeroes.csv -t tree.out -m average -l clusters.tsv -sc -b cophenetic -n 2 -p 1 0.5 -d , -f 50.0
  files:
    - path: "tree.out"
      should_exist: true
    - path: clusters.tsv
      should_exist: true

- name: Run mcluster file does not exist
  tags:
    - should_fail
  command: dist-mat mcluster --input tests/R1KC1K.2-zeroes.does-not-exist.csv -t tree.out -m average -l clusters.tsv -sc -b cophenetic -n 2 -p 1 0.5 -d ,
  exit_code: 1
  files:
    - path: "tree.out"
      should_exist: false
    - path: clusters.tsv
      should_exist: false
  stderr:
    contains:
      - "FileNotFoundError: Input file tests/R1KC1K.2-zeroes.does-not-exist.csv does not exist."

- name: Run mcluster id contains null value
  tags:
    - should_fail
  command: dist-mat mcluster --input src/dist_mat/tests/data/test_profiles_null_in_id_column.csv -d, -t tree.out -m average -l clusters.tsv -sc -b cophenetic -n 2 -p 1 0.5
  exit_code: 1
  files:
    - path: "tree.out"
      should_exist: false
    - path: clusters.tsv
      should_exist: false
  stderr:
    contains:
      - "polars.exceptions.RowsError: Missing values identified in left most column (ID column), left most column can have no missing values."
