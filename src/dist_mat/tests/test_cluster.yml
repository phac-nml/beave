- name: Run cluster cophenetic fail thresholds
  tags:
    - should_fail
  command: dist-mat cluster --input tests/R1KC1K.tsv -t tree.out -m average -l clusters.tsv -sc -b cophenetic -n 2 --thresholds 0.1.0
  exit_code: 2
  files:
    - path: "tree.out"
      should_exist: false
    - path: clusters.tsv
      should_exist: false
  stderr:
    contains:
      - "dist-mat cluster: error: argument --thresholds/-p: invalid cluster_threshold value: '0.1.0'"

- name: Run cluster fail thresholds missing argument
  tags:
    - should_fail
  command: dist-mat cluster --input tests/R1KC1K.tsv -t tree.out -m average -l clusters.tsv -sc -b cophenetic -n 2 --thresholds
  exit_code: 2
  files:
    - path: "tree.out"
      should_exist: false
    - path: clusters.tsv
      should_exist: false
  stderr:
    contains:
      - "dist-mat cluster: error: argument --thresholds/-p: expected at least one argument"

- name: Run cluster csv
  tags:
    - should_pass
  command: dist-mat cluster --input tests/R1KC1K.2-zeroes.csv -t tree.out -m average -l clusters.tsv -sc -b cophenetic -n 2 -p 1 0.5 -d ,
  files:
    - path: "tree.out"
      should_exist: true
    - path: clusters.tsv
      should_exist: true

- name: Run cluster threshold should fail due to negative number being passed
  tags:
    - should_fail
  command: dist-mat cluster --input tests/R1KC1K.2-zeroes.csv -t tree.out -m average -l clusters.tsv -sc -b cophenetic -n 2 -p 1 0.5 -d , -f -1
  exit_code: 2
  files:
    - path: "tree.out"
      should_exist: false
    - path: clusters.tsv
      should_exist: false
  stderr:
    contains:
      - "dist-mat cluster: error: argument --filter-threshold/-f: invalid percentage_range value: '-1'"

