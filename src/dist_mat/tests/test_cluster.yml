  command: dist-mat cluster --input tests/R1KC1K.tsv -t tree.out -m average -l clusters.tsv -sc -b cophenetic -n 2 --thresholds 10.0 9.0 8.0
  files:
    - path: "tree.out"
      should_exist: true
    - path: clusters.tsv
      should_exist: true

