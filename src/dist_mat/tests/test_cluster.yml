- name: Run cluster pass cophenetic no scaled or missing counted metric, passing 0 cores program should default to 1
  tags:
    - should_pass
  command: dist-mat cluster --input tests/R1KC1K.tsv -t tree.out -m average -l clusters.tsv -b cophenetic -n 0 --thresholds 10.0 9.0 8.0
  files:
    - path: "tree.out"
