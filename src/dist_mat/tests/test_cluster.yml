      should_exist: false
    - path: clusters.tsv
      should_exist: false
  stderr:
    contains:
      - "dist-mat cluster: error: argument --filter-threshold/-f: invalid percentage_range value: '101'"

- name: Run cluster threshold should pass
  tags:
    - should_pass
  command: dist-mat cluster --input tests/R1KC1K.2-zeroes.csv -t tree.out -m average -l clusters.tsv -sc -b cophenetic -n 2 -p 1 0.5 -d , -f 50.0
  files:
    - path: "tree.out"
      should_exist: true
    - path: clusters.tsv
      should_exist: true

- name: Run cluster file does not exist
  tags:
    - should_fail
  command: dist-mat cluster --input tests/R1KC1K.2-zeroes.does-not-exist.csv -t tree.out -m average -l clusters.tsv -sc -b cophenetic -n 2 -p 1 0.5 -d ,
  exit_code: 1
  files:
    - path: "tree.out"
      should_exist: false
    - path: clusters.tsv
      should_exist: false
  stderr:
    contains:
      - "FileNotFoundError: Input file does not exist. tests/R1KC1K.2-zeroes.does-not-exist.csv"

- name: Run cluster id contains null value
  tags:
    - should_fail
  command: dist-mat cluster --input src/dist_mat/tests/data/test_profiles_null_in_id_column.csv -d, -t tree.out -m average -l clusters.tsv -sc -b cophenetic -n 2 -p 1 0.5
  exit_code: 1
  files:
    - path: "tree.out"
      should_exist: false
    - path: clusters.tsv
      should_exist: false
  stderr:
    contains:
      - "polars.exceptions.RowsError: Missing values identified in left most column (ID column), left most column can have no missing values."

